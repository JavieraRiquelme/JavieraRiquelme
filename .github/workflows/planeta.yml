name: planeta

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dibujar planeta y burbujas
        run: python scripts/generate.py
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          EXCLUDE_LANGS: "Jupyter Notebook"
          MAX_LANGS: "10"

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || (git commit -m "🪐 planeta actualizado" && git push)
